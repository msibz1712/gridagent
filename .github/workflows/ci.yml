# CI: everything runs offline (recorded data, scripted/oracle model), so it needs
# no API key, costs nothing and gives the same result on every run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and offline evals
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Throwaway PostgreSQL (same major version as Supabase) for the database tests.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: gridagent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.20"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked --extra web --extra db

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests (offline; live tests are skipped by default; db tests use the service)
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/gridagent_test
        run: uv run pytest --cov --cov-report=term

      - name: Validate agent configs
        run: uv run garden validate

      - name: Offline evals for every agent version (must pass 100%)
        env:
          GARDEN_REPORTS_DIR: reports
        run: |
          for version in $(ls agents/energy_qa | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'); do
            uv run garden eval "energy_qa@${version}" --oracle --min-pass-rate 1.0
          done

      # Regression gate, not a quality claim: the recorded real answers of 0.12.0 pass 98.6%
      # after the fixes their live run prompted (first live pass: 95%). The gate allows one
      # failure, so a change that breaks how real answers are checked fails the build.
      - name: Replay the recorded live run of the current version (real model answers, free)
        env:
          GARDEN_REPORTS_DIR: reports
        run: uv run garden eval energy_qa@0.12.0 --min-pass-rate 0.98

      # Same idea for the news writer: its recorded stories pass 16/17 (94.1%).
      - name: Replay the news writer's recorded stories (free)
        env:
          GARDEN_REPORTS_DIR: reports
        run: uv run garden eval-stories news_writer@0.4.0 --min-pass-rate 0.94

      - name: Keep eval reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-reports
          path: reports/
          if-no-files-found: ignore

  docker:
    name: Docker image builds and runs
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t gridagent:ci .

      - name: CLI works in the container
        run: |
          docker run --rm gridagent:ci version
          docker run --rm gridagent:ci validate
          docker run --rm gridagent:ci eval energy_qa --oracle --min-pass-rate 1.0

      - name: Website starts and answers the health check
        run: |
          # No automatic morning briefing in CI: it would call the live data APIs.
          docker run -d --name web -e GARDEN_AUTO_BRIEFING=0 -p 127.0.0.1:8000:8000 gridagent:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          # "/" redirects: to the dashboard, or to the chat while no briefing exists
          curl -fsSL http://127.0.0.1:8000/ | grep -q "<title>GridAgent"
          # Without an API key the site must say so instead of failing.
          curl -fsS http://127.0.0.1:8000/api/config | grep -q '"available":false'

      - name: Container logs on failure
        if: failure()
        run: docker logs web || true
