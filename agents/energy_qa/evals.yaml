# Eval set for energy_qa. Shared by all versions, so versions are compared on the
# same questions.
#
# The data world is fixed: evals always use tests/fixtures and `today` below,
# even with --live, so results are reproducible and "missing data" is really missing.
# Available data: generation + prices for 2026-10-01..31 and 2026-11-02..08,
# prices for 2026-11-13.
#
# Expected numbers were computed independently from the raw fixture JSON
# (tests/independent_calc.py); tests/test_eval_set.py re-checks them on every run.
#
# outcome: answer | refuse | no_data | refuse_or_no_data
# numbers: each needs one match in the answer (any of `values`, e.g. GWh or TWh),
#          within tolerance_pct (default 1%) or tolerance_abs.
# dates:   ISO dates the answer must mention (any common format).
# tool_calls: each must match one actual call (only the listed args are compared).
#             The oracle (offline scripted agent) makes exactly these calls.
# oracle_answer: the reference answer used by the oracle.

name: energy_qa core
version: 1.0.0
today: "2026-11-14"
cases:
  # ---------------- factual: prices ----------------
  - id: price_mean_yesterday
    category: factual
    question: What was the average day-ahead price yesterday?
    outcome: answer
    numbers: [{label: mean price EUR/MWh, values: [161.73]}]
    dates: ["2026-11-13"]
    tool_calls:
      - {name: get_day_ahead_price, args: {start: "2026-11-13", end: "2026-11-13"}}
      - {name: compute_stats, args: {operation: mean}}
    oracle_answer: "The average day-ahead price on 13 November 2026 was 161.73 EUR/MWh. Source: Bundesnetzagentur | SMARD.de via Energy-Charts.info"

  - id: price_max_yesterday
